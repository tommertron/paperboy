<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperboy</title>
<style>
  :root { --bg: #faf8f4; --fg: #222; --dim: #777; --line: #e4e0d8; --accent: #2a5db0; --ok: #2e7d32; --warn: #b26a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1d; --fg: #e8e6e3; --dim: #999; --line: #333; --accent: #7aa7ff; --ok: #7bc47f; --warn: #e0a040; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font: 700 26px Georgia, serif; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card b { display: block; font-size: 22px; }
  .card span { color: var(--dim); font-size: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .bar select, .bar input { flex: 1; min-width: 140px; }
  input, select, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; gap: 10px; align-items: flex-start; }
  li .t { flex: 1; min-width: 0; }
  li a.title { color: var(--fg); text-decoration: none; font-weight: 600; }
  li a.title:hover { color: var(--accent); }
  .meta { color: var(--dim); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-right: 4px; border: 1px solid currentColor; }
  .tag.card-on { color: var(--ok); } .tag.pending { color: var(--warn); }
  .acts { display: flex; gap: 6px; flex-shrink: 0; }
  .acts button { padding: 3px 8px; font-size: 12px; }
  .err { color: var(--warn); margin-bottom: 12px; }
  #login { max-width: 360px; margin: 15vh auto; }
  #login input { width: 100%; margin: 10px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <section id="login" class="hidden">
    <h1>Paperboy</h1>
    <div class="sub">Enter the token from your server's config.json (the same one the reader uses).</div>
    <form id="loginform"><input id="token" type="password" placeholder="Token" autocomplete="current-password"><button>Sign in</button></form>
    <div id="loginerr" class="err"></div>
  </section>

  <section id="app" class="hidden">
    <h1>Paperboy</h1>
    <div class="sub" id="sub"></div>
    <div id="errors"></div>
    <div class="cards" id="cards"></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Filter">
      <select id="show">
        <option value="all">Everything</option>
        <option value="off">Not on the reader</option>
        <option value="on">On the reader</option>
      </select>
      <button id="refresh" title="Re-read Instapaper/Feedbin now">Refresh</button>
      <button id="signout">Sign out</button>
    </div>
    <ul id="list"></ul>
  </section>
</main>
<script>
const base = location.pathname.replace(/\/(ui)?$/, "");
let token = localStorage.getItem("paperboy-token") || "";
let data = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(base + path, {...opts, headers: {Authorization: "Bearer " + token, ...(opts.body ? {"Content-Type": "application/json"} : {})}});
  if (r.status === 401) { signOut("That token didn't work."); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r;
}

function signOut(msg) {
  token = ""; localStorage.removeItem("paperboy-token");
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("loginerr").textContent = msg || "";
}

async function load() {
  data = await (await api("/status")).json();
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  const names = {instapaper: "Instapaper", feedbin: "Feedbin"};
  $("sub").textContent = `v${data.version} · ${data.sources.map((s) => names[s] || s).join(" + ")} · finished at ${data.archive_at}%`;
  $("errors").innerHTML = Object.entries(data.errors).map(([s, e]) => `<div class="err">Couldn't read ${esc(names[s] || s)}: ${esc(e)}</div>`).join("");
  const a = data.articles, on = a.filter((i) => i.on_card).length;
  const tidy = data.last_tidy_result;
  $("cards").innerHTML = [
    [a.length, "on the reading list"],
    [on, "on the reader"],
    [a.length - on, "waiting for Sync all"],
    [data.finished_count, "finished so far"],
    [data.last_tidy ? data.last_tidy.replace(/:\d\d$/, "") : "never",
     data.reader_sync ? (tidy ? `last tidy-up: +${tidy.added.length}, −${tidy.removed_ids.length}` : "last home tidy-up") : "home tidy-up is off"],
  ].map(([n, l]) => `<div class="card"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");
  render();
}

function render() {
  const q = $("q").value.toLowerCase(), show = $("show").value;
  const rows = data.articles.filter((i) =>
    (show === "all" || (show === "on") === i.on_card) &&
    (!q || (i.title + " " + i.site).toLowerCase().includes(q)));
  $("list").innerHTML = rows.map((i) => `
    <li>
      <div class="t">
        <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
        <div class="meta">
          ${i.on_card ? '<span class="tag card-on">on reader</span>' : ""}
          ${i.ready ? "" : '<span class="tag pending">building</span>'}
          ${esc([i.source === "feedbin" ? "Feedbin" : "Instapaper", i.site, i.date].filter(Boolean).join(" · "))}
        </div>
      </div>
      <div class="acts">
        <button data-epub="${esc(i.id)}" title="Download the EPUB">EPUB</button>
        <button data-finish="${esc(i.id)}" title="${i.source === "feedbin" ? "Unstar in Feedbin" : "Archive in Instapaper"}">Finished</button>
      </div>
    </li>`).join("") || '<li class="meta">Nothing here.</li>';
}

$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const item = data.articles.find((i) => i.id === (b.dataset.epub || b.dataset.finish));
  try {
    if (b.dataset.epub) {
      b.textContent = "…";
      const blob = await (await api("/epub/" + item.id)).blob();
      const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: item.title.replace(/[\/\\:]/g, "-") + ".epub"});
      a.click(); URL.revokeObjectURL(a.href);
      b.textContent = "EPUB";
    } else {
      const where = item.source === "feedbin" ? "Unstar it in Feedbin" : "Archive it in Instapaper";
      if (!confirm(`${where}?\n\n${item.title}\n\nThe next home tidy-up removes it from the reader.`)) return;
      b.disabled = true;
      await api("/finish", {method: "POST", body: JSON.stringify({id: item.id})});
      await load();
    }
  } catch (err) { alert(err.message); b.disabled = false; b.textContent = b.dataset.epub ? "EPUB" : "Finished"; }
});

$("loginform").addEventListener("submit", (e) => {
  e.preventDefault(); token = $("token").value.trim();
  localStorage.setItem("paperboy-token", token); load().catch(() => {});
});
$("q").addEventListener("input", render);
$("show").addEventListener("change", render);
$("refresh").addEventListener("click", async () => { await api("/refresh", {method: "POST"}); load(); });
$("signout").addEventListener("click", () => signOut());

token ? load().catch((e) => {
  if (e.message !== "unauthorized") { $("login").classList.remove("hidden"); $("loginerr").textContent = "Couldn't load: " + e.message; }
}) : signOut();
</script>
</body>
</html>
